apiVersion: apps/v1
kind: Deployment

metadata:
  name: eks-demo-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: eks-demo-app

  template:
    metadata:
      labels:
        app: eks-demo-app

    spec:
      containers:
        - name: eks-demo-app
          image: 683604924610.dkr.ecr.ap-south-1.amazonaws.com/eks-demo-app:1.0

          ports:
            - containerPort: 8000

          env:
            - name: APP_VERSION
              value: "1.0"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
